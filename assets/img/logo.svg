<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" width="320" height="72" role="img" aria-label="Denegri Web — Páginas web para tu negocio">
  <defs>
    <linearGradient id="dwGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- Panel de fondo (para que se vea bien sobre cualquier superficie) -->
  <rect width="320" height="72" rx="16" fill="#0a0b11"/>

  <!-- Monograma -->
  <rect x="14" y="14" width="44" height="44" rx="13" fill="url(#dwGrad)"/>
  <g transform="translate(14 14) scale(1.8333333)">
    <path fill="#ffffff" fill-rule="evenodd"
      d="M6.25 4h3.5a8 8 0 0 1 0 16H6.25zM9.25 7h0.5a5 5 0 0 1 0 10h-0.5z"/>
  </g>

  <!-- Wordmark -->
  <text x="74" y="38" font-family="Sora, Inter, 'Segoe UI', system-ui, sans-serif"
        font-size="25" font-weight="700" fill="#eef0f7">Denegri Web<tspan fill="#22d3ee">.</tspan></text>
  <text x="75" y="55" font-family="Inter, 'Segoe UI', system-ui, sans-serif"
        font-size="10" letter-spacing="2.2" fill="#8f95a8">PÁGINAS WEB PARA TU NEGOCIO</text>
</svg>
